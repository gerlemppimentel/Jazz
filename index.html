<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Jazz24 — Híbrido (Rádio & Local)</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<!-- Biblioteca para ler metadados (ID3) de MP3 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
  /* === VARIÁVEIS DE TEMA (CLARO/ESCURO) === */
  :root {
    --bg-overlay: radial-gradient(60% 50% at 50% 25%, rgba(0,0,0,0.15), rgba(0,0,0,0.88));
    --bg-brightness: 0.32;
    --text-main: #ffffff;
    --text-muted: rgba(255,255,255,0.7);
    --card-bg: rgba(22, 22, 22, 0.62);
    --card-border: rgba(255, 255, 255, 0.11);
    --btn-bg: #ffffff;
    --btn-color: #000000;
    --badge-bg: rgba(255, 255, 255, 0.1);
    --focus-ring: #ffffff;
    --turntable-bg: radial-gradient(circle at center, #6b7280 0%, #374151 100%);
  }

  .light-mode {
    --bg-overlay: radial-gradient(60% 50% at 50% 25%, rgba(255,255,255,0.4), rgba(255,255,255,0.85));
    --bg-brightness: 0.85;
    --text-main: #111111;
    --text-muted: rgba(0,0,0,0.7);
    --card-bg: rgba(255, 255, 255, 0.55);
    --card-border: rgba(0, 0, 0, 0.15);
    --btn-bg: #111111;
    --btn-color: #ffffff;
    --badge-bg: rgba(0, 0, 0, 0.1);
    --focus-ring: #111111;
    --turntable-bg: radial-gradient(circle at center, #d1d5db 0%, #9ca3af 100%);
  }

  /* === RESET E SETUP === */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color: var(--text-main);
    background: #0a0a0a;
    overscroll-behavior: none;
    -webkit-tap-highlight-color:transparent;
    transition: color 0.4s ease;
  }

  /* Acessibilidade (TV) */
  button:focus-visible, input[type="range"]:focus-visible, label:focus-within {
    outline: 4px solid var(--focus-ring); outline-offset: 4px; border-radius: 8px;
  }
  .play:focus-visible { border-radius: 50%; }

  /* === BACKGROUND === */
  .bg{position:fixed;inset:0;z-index:-1}
  .bg img{
    width:100%;height:100%;object-fit:cover;
    filter: blur(44px) brightness(var(--bg-brightness)) saturate(1.25);
    transform:scale(1.12);transition:all 1s ease;
  }
  .bg::after{content:'';position:absolute;inset:0;background:var(--bg-overlay);transition:background 0.4s;}

  /* === LAYOUT BASE (MOBILE FIRST PORTRAIT) === */
  .app{
    display:flex; align-items:center; justify-content:center;
    height:100dvh; width:100vw;
    padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }

  .card{
    width:100%; max-width:520px; background:var(--card-bg);
    backdrop-filter:blur(28px) saturate(1.25); -webkit-backdrop-filter:blur(28px) saturate(1.25);
    border:1px solid var(--card-border); border-radius:24px; padding:18px;
    box-shadow:0 24px 70px rgba(0,0,0,0.65);
    display:flex; flex-direction:column; gap:16px; max-height:100%; overflow-y:auto;
    transition: background 0.4s, border 0.4s;
  }

  .card-content {
    display: flex; flex-direction: column; gap: 12px; flex: 1; justify-content: center;
  }

  /* --- ARTE E TOCA-DISCOS --- */
  .art {
    position: relative; width: 100%; max-width: 500px; aspect-ratio: 1; 
    border-radius: 18px; overflow: hidden; background: #151515; 
    flex-shrink: 0; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    min-height: 250px; display: flex;
  }
  
  @supports not (aspect-ratio: 1) {
    .art::before { content: ""; display: block; padding-bottom: 100%; }
  }

  .art img.cover-img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .8s cubic-bezier(.2,.8,.2,1), opacity 0.5s ease;
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 2;
  }
  .art.playing img.cover-img { transform: scale(1.05); }
  .art.has-cover img.cover-img { opacity: 1; pointer-events: auto; }
  .art:not(.has-cover) img.cover-img { opacity: 0; pointer-events: none; }
  .art.has-cover .turntable-container { display: none; }
  .art:not(.has-cover) .turntable-container { display: flex; }

  .turntable-container {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; height: 100%; z-index: 1; background: var(--turntable-bg);
    align-items: center; justify-content: center; transition: background 0.4s;
  }
  
  @keyframes vinyl-spin-anim { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .vinyl-spin { animation: vinyl-spin-anim 1.8s linear infinite; animation-play-state: paused; }
  .art.playing .vinyl-spin { animation-play-state: running; }
  .vinyl-grooves { background: radial-gradient(circle at center, #18181b 0%, #18181b 18%, transparent 18.5%, transparent 19%, #111 19.5%, #111 28%, transparent 28.5%, transparent 29%, #1c1c1e 29.5%, #1c1c1e 40%, transparent 40.5%, transparent 41%, #111 41.5%, #111 55%, transparent 55.5%, transparent 56%, #1a1a1a 56.5%, #1a1a1a 70%, transparent 70.5%, transparent 71%, #0d0d0d 71.5%, #0d0d0d 88%, #050505 100%); }
  .vinyl-sheen { background: conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,0.03) 0deg, rgba(255,255,255,0.12) 45deg, rgba(255,255,255,0.03) 90deg, rgba(255,255,255,0.03) 180deg, rgba(255,255,255,0.12) 225deg, rgba(255,255,255,0.03) 270deg, rgba(255,255,255,0.03) 360deg); mix-blend-mode: screen; pointer-events: none; }
  .tonearm-assembly { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-origin: 215px 35px; transform: rotate(-22deg); }
  .art.playing .tonearm-assembly { transform: rotate(0deg); }
  @keyframes stylus-vibrate { 0% { transform: translate(0, 0); } 50% { transform: translate(0.3px, -0.3px); } 100% { transform: translate(0, 0); } }
  .art.playing .playing-stylus { animation: stylus-vibrate 0.12s steps(2, start) infinite; }

  /* --- BOTÕES DE AÇÃO (TELA CHEIA E TEMA) --- */
  .action-btn {
    background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.16);
    color: #fff; border-radius: 50%; width: 40px; height: 40px;
    display: grid; place-items: center; cursor: pointer; transition: 0.2s;
    z-index: 10; position: absolute;
  }
  .light-mode .action-btn { background: rgba(255,255,255,0.4); color: #000; border-color: rgba(0,0,0,0.15); }
  .action-btn:hover { transform: scale(1.05); }
  .action-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .btn-top-right { top: 10px; right: 10px; }
  .btn-bottom-left { bottom: 10px; left: 10px; }

  /* --- TOGGLE ONLINE / LOCAL --- */
  .mode-toggle {
    position: absolute; top: 10px; left: 10px; z-index: 10;
    background: rgba(0,0,0,0.45); backdrop-filter: blur(10px);
    border-radius: 999px; border: 1px solid rgba(255,255,255,0.16);
    display: flex; align-items: center; padding: 4px;
  }
  .light-mode .mode-toggle { background: rgba(255,255,255,0.4); border-color: rgba(0,0,0,0.15); }
  
  .mode-dot {
    width: 8px; height: 8px; border-radius: 50%; margin: 0 6px;
    background: #ff2a2a; box-shadow: 0 0 10px #ff2a2a; transition: 0.3s;
  }
  .art.playing .mode-dot { background: #22c55e; box-shadow: 0 0 10px #22c55e; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.55; transform: scale(0.88); } }

  .mode-btn {
    background: none; border: none; color: var(--text-muted);
    font-size: 10px; font-weight: 800; letter-spacing: 0.1em;
    padding: 6px 10px; border-radius: 999px; cursor: pointer; transition: 0.3s; outline: none;
  }
  .mode-btn.active { color: var(--text-main); background: rgba(255,255,255,0.15); }
  .light-mode .mode-btn.active { background: rgba(0,0,0,0.15); }

  /* --- TEXTOS E METADADOS --- */
  .meta{ display: flex; flex-direction: column; text-align: center; }
  .station{font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:4px;}
  .title{font-family:'Fraunces',serif; font-size:clamp(22px, 5vw, 32px); line-height:1.2; word-break:break-word;}
  .artist{font-size:14px; color:var(--text-muted); margin-top:2px; word-break:break-word;}

  canvas{width:100%; height:40px; display:block; margin: 0 auto;}

  /* --- CONTROLES DE ÁUDIO --- */
  .controls{ display:flex; align-items:center; justify-content:center; gap:24px; }
  .nav-btn{
    background:none;border:none;color:var(--text-main);cursor:pointer;
    opacity:.75;transition:0.2s; display:grid;place-items:center; width:54px;height:54px;
  }
  .nav-btn:hover{opacity:1; transform:scale(1.1);}
  .nav-btn:active{transform:scale(0.9)}
  .nav-btn svg{width:36px;height:36px}

  .play{
    width:80px;height:80px; border-radius:50%; background:var(--btn-bg); color:var(--btn-color);
    border:none; display:grid; place-items:center; cursor:pointer;
    transition:transform .15s; box-shadow:0 10px 28px rgba(0,0,0,0.2); flex-shrink:0;
  }
  .play:active{transform:scale(.93)}
  .play svg{width:34px;height:34px; margin-left:4px} 
  .play.is-paused svg{margin-left:0}

  .bottom-bar{ display:flex; flex-direction:column; gap:12px; }
  .vol{ display:flex; align-items:center; gap:8px; width:100%; }
  .vol input{ flex:1; accent-color:var(--text-main); height:4px; cursor:pointer; }
  .icon-btn{ background:none; border:none; color:var(--text-main); cursor:pointer; font-size:20px; }
  .info-group { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .badge-line{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .badge{ font-size:10px; background:var(--badge-bg); padding:5px 8px; border-radius:999px; }
  .status{ font-size:11px; color:var(--text-muted); min-height:16px; }

  /* === CORREÇÃO: MOBILE PAISAGEM === */
  @media (max-height: 600px) and (orientation: landscape) {
    .app { padding: 8px; }
    .card {
      flex-direction: row; padding: 12px; gap: 16px;
      max-width: 800px; max-height: 100vh; align-items: center; border-radius: 16px;
    }
    .art { width: 40%; max-width: 250px; max-height: 90vh; }
    .card-content { width: 60%; gap: 6px; overflow-y: auto; padding-right: 8px; align-items: flex-start; text-align: left; }
    .meta { text-align: left; }
    .title { font-size: clamp(18px, 4vh, 24px); }
    .artist { font-size: 13px; }
    .controls { gap: 16px; margin: 4px 0; justify-content: flex-start; }
    .play { width: 54px; height: 54px; }
    .play svg { width: 24px; height: 24px; }
    .nav-btn svg { width: 28px; height: 28px; }
    canvas { height: 30px; }
    .info-group { align-items: flex-start; }
    .badge-line { justify-content: flex-start; }
    
    .action-btn { width: 32px; height: 32px; }
    .action-btn svg { width: 16px; height: 16px; }
  }

  /* Telas Maiores (Tablet, Desktop, TV) */
  @media (min-width: 768px) and (min-height: 601px) and (orientation: landscape) {
    .card { max-width: 900px; flex-direction: row; align-items: center; padding: 24px; gap: 32px; }
    .art { width: 45%; max-width: 400px; max-height: 80vh; margin: 0; }
    .card-content { width: 55%; text-align: left; align-items: flex-start; }
    .meta { text-align: left; width: 100%; }
    .controls { justify-content: flex-start; width: 100%; margin: 16px 0; }
    canvas { height: 60px; }
    .info-group { align-items: flex-start; }
    .badge-line { justify-content: flex-start; }
  }

  /* Desktop Largo e TV */
  @media (min-width: 1200px) {
    .card { max-width: 1100px; padding: 40px; gap: 60px; }
    .art { max-width: 500px; }
    .title { font-size: 42px; }
    .artist { font-size: 18px; }
    .play { width: 90px; height: 90px; }
    .nav-btn svg { width: 44px; height: 44px; }
  }
</style>
</head>
<body>
<div class="bg"><img id="bgImg" src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?q=80&w=1400&auto=format&fit=crop" alt=""></div>

<div class="app" id="appContainer">
  <div class="card">
    
    <!-- LADO ESQUERDO (ARTE) -->
    <div class="art" id="artWrap">
      
      <!-- Toggle Mode: Online / Local -->
      <div class="mode-toggle" id="modeToggle">
        <div class="mode-dot" id="modeDot"></div>
        <button class="mode-btn active" id="btnOnline">ONLINE</button>
        <button class="mode-btn" id="btnLocal">LOCAL</button>
      </div>

      <!-- Input de ficheiros com os 3 atributos para ser Universal (PC e Android) -->
      <input type="file" id="folderInput" webkitdirectory directory multiple accept="audio/*" style="display:none">

      <!-- Botão Tela Cheia (Canto Superior Direito) -->
      <button class="action-btn btn-top-right" id="fsBtn" aria-label="Tela Cheia" title="Tela Cheia">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>

      <!-- Botão Tema (Canto Inferior Esquerdo) -->
      <button class="action-btn btn-bottom-left" id="themeBtn" aria-label="Alternar Tema" title="Mudar Tema">🌓</button>

      <!-- Imagem de Capa -->
      <img id="cover" class="cover-img" src="" alt="album art">
      
      <!-- Toca-Discos com fundo cinza -->
      <div class="turntable-container" id="turntable">
        <div style="position: relative; width: 85%; height: 85%; display: flex; align-items: center; justify-content: center;">
          <div style="position: relative; width: 100%; height: 100%; background: linear-gradient(to top right, #18181b, #27272a, #3f3f46); border-radius: 50%; box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; border: 3px solid #3f3f46;">
              <div class="vinyl-spin vinyl-grooves" style="position: relative; width: 92%; height: 92%; border-radius: 50%; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;">
                  <div class="vinyl-sheen" style="position: absolute; inset: 0; border-radius: 50%;"></div>
                  
                  <!-- SELO CENTRAL E FURO CORRIGIDOS -->
                  <div style="position: relative; width: 36%; height: 36%; background: linear-gradient(to bottom right, #dc2626, #9f1239); border-radius: 50%; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); border: 2px solid rgba(248,113,113,0.5); overflow: hidden;">
                      <div style="position: absolute; inset: 6px; border: 1px solid rgba(254,202,202,0.3); border-radius: 50%;"></div>
                      
                      <!-- Texto Superior -->
                      <div style="position: absolute; top: 18%; width: 100%; text-align: center;">
                          <span style="font-size: 8px; font-weight: 700; color: #fff; letter-spacing: 0.1em;">PLAYER</span>
                      </div>

                      <!-- FURO CENTRAL (Posição Absoluta Exata) -->
                      <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; background: #09090b; border-radius: 50%; box-shadow: inset 0 2px 4px rgba(0,0,0,0.6); border: 1px solid #3f3f46; z-index: 5;"></div>
                      
                      <!-- Texto Inferior -->
                      <div style="position: absolute; bottom: 18%; width: 100%; text-align: center;">
                          <span style="font-size: 6px; color: #fecaca; font-weight: 500;">HÍBRIDO</span>
                      </div>
                  </div>
              </div>
          </div>
          <div class="tonearm-assembly" style="position: absolute; top: -5%; right: -5%; width: 75%; height: 100%; pointer-events: none; z-index: 5;">
              <svg style="width: 100%; height: 100%; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.7));" viewBox="0 0 240 340" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="215" cy="35" r="24" fill="url(#piv-grad)" stroke="#52525b" stroke-width="2"/>
                  <circle cx="215" cy="35" r="14" fill="#18181b"/>
                  <circle cx="215" cy="35" r="6" fill="#71717a"/>
                  <rect x="203" y="-5" width="24" height="18" rx="3" fill="url(#weight-grad)" stroke="#3f3f46" stroke-width="1"/>
                  <path d="M 215 35 Q 210 130 185 180 T 130 265" fill="none" stroke="url(#metal-grad)" stroke-width="7" stroke-linecap="round"/>
                  <path d="M 215 35 Q 210 130 185 180 T 130 265" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round"/>
                  <circle cx="130" cy="265" r="4.5" fill="#a1a1aa" stroke="#27272a"/>
                  <g transform="translate(130, 265) rotate(32)">
                      <path d="M-4 0 L4 0 L5 22 L-5 22 Z" fill="#27272a" stroke="#52525b" stroke-width="1"/>
                      <rect x="-4.5" y="22" width="9" height="16" rx="1.5" fill="#18181b" stroke="#3f3f46"/>
                      <polygon points="0,38 -2.5,44 2.5,44" fill="#facc15" class="playing-stylus"/>
                      <circle cx="0" cy="27" r="1.5" fill="#60a5fa"/>
                  </g>
                  <defs>
                      <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                          <stop offset="0%" stop-color="#e4e4e7"/><stop offset="50%" stop-color="#a1a1aa"/><stop offset="100%" stop-color="#52525b"/>
                      </linearGradient>
                      <radialGradient id="piv-grad" cx="50%" cy="50%" r="50%">
                          <stop offset="0%" stop-color="#d4d4d8"/><stop offset="70%" stop-color="#71717a"/><stop offset="100%" stop-color="#27272a"/>
                      </radialGradient>
                      <linearGradient id="weight-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                          <stop offset="0%" stop-color="#3f3f46"/><stop offset="50%" stop-color="#71717a"/><stop offset="100%" stop-color="#27272a"/>
                      </linearGradient>
                  </defs>
              </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- LADO DIREITO (CONTEÚDO) -->
    <div class="card-content">
      <div class="meta">
        <div class="station" id="stationDesc">Welcome to Jazz24 from Seattle and Tacoma.</div>
        <div class="title" id="tTitle">Jazz24</div>
        <div class="artist" id="tArtist">Seattle • jazz24.org</div>
      </div>

      <canvas id="viz"></canvas>

      <div class="controls">
        <button class="nav-btn" id="prevBtn" aria-label="Rádio Anterior">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <button class="play" id="playBtn" aria-label="Play">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v14l11-7-11-7z"/></svg>
        </button>

        <button class="nav-btn" id="nextBtn" aria-label="Próxima Rádio">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6v12z"/></svg>
        </button>
      </div>

      <div class="bottom-bar">
        <div class="vol">
          <button class="icon-btn" id="muteBtn" title="Mudo" aria-label="Mudo">🔊</button>
          <input type="range" id="vol" min="0" max="1" step="0.01" value="0.88" aria-label="Volume">
        </div>
        
        <div class="info-group">
          <div class="badge-line">
            <span class="badge" id="formatBadge">HTTPS • STREAM</span>
            <span class="badge" id="artBadge">Arte: iTunes Search</span>
          </div>
          <div class="status" id="status"></div>
        </div>
      </div>
    </div>
    
  </div>
</div>

<audio id="audio" crossorigin="anonymous" preload="none"></audio>

<script type="module">
const STATIONS = [
  { name: "Jazz24", url: "https://knkx-live-a.edge.audiocdn.com/6285_256k", desc: "Welcome to Jazz24 from Seattle and Tacoma", artist: "Seattle • jazz24.org" },
  { name: "Ella Jazz Ballads", url: "https://stream.ella-radio.de/ella-jazz-ballads", desc: "Ella Radio. Made with ♥ for music lovers.", artist: "Ella Radio • Jazz Ballads" },
  { name: "Ella Modern Vocal Jazz", url: "https://stream.ella-radio.de/ella-modern-vocal-jazz", desc: "Ella Radio. Made with ♥ for music lovers.", artist: "Ella Radio • Modern Vocal Jazz" },
  { name: "Ella Coffee Jazz", url: "https://stream.ella-radio.de/ella-coffee-jazz", desc: "Ella Radio. Made with ♥ for music lovers.", artist: "Ella Radio • Coffee Jazz" }
];

const DEFAULT_BG = "https://images.unsplash.com/photo-1511379938547-c1f69419868d?q=80&w=1400&auto=format&fit=crop";

// Variáveis de Controle
let currentStationIndex = 0;
let currentStation = STATIONS[currentStationIndex];
let isLocalMode = false;
let localPlaylist = [];
let localIndex = 0;
let isPlaying = false;
let currentLocalUrl = null; 

// Elementos da DOM
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const vol = document.getElementById('vol');
const muteBtn = document.getElementById('muteBtn');
const cover = document.getElementById('cover');
const bgImg = document.getElementById('bgImg');
const artWrap = document.getElementById('artWrap');
const tTitle = document.getElementById('tTitle');
const tArtist = document.getElementById('tArtist');
const statusEl = document.getElementById('status');
const artBadge = document.getElementById('artBadge');
const formatBadge = document.getElementById('formatBadge');
const stationDesc = document.getElementById('stationDesc');
const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');
const appContainer = document.getElementById('appContainer');
const fsBtn = document.getElementById('fsBtn');
const themeBtn = document.getElementById('themeBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const folderInput = document.getElementById('folderInput');

// Elementos do Toggle
const btnOnline = document.getElementById('btnOnline');
const btnLocal = document.getElementById('btnLocal');

let analyser, dataArray, audioCtx, sourceNode;
let lastQuery = "", lastStreamTitle = "";
let metaAbort = null, metaInterval = null;

/* --- CONTROLE DE TEMA (CLARO/ESCURO) --- */
let isLightMode = false;
themeBtn.addEventListener('click', () => {
  isLightMode = !isLightMode;
  document.body.classList.toggle('light-mode', isLightMode);
});

/* --- LÓGICA DO TOGGLE ONLINE / LOCAL --- */
btnOnline.addEventListener('click', () => {
  if (!isLocalMode) return; 
  isLocalMode = false;
  
  btnOnline.classList.add('active');
  btnLocal.classList.remove('active');
  
  const wasPlaying = isPlaying;
  if (wasPlaying) {
    audio.pause(); stopMetadata(); isPlaying = false;
    artWrap.classList.remove('playing');
  }

  currentStationIndex = 0;
  currentStation = STATIONS[0];
  audio.src = ''; 
  updateUIForWebStation();
  
  if (wasPlaying) togglePlay();
});

btnLocal.addEventListener('click', () => {
  folderInput.click();
});

/* --- LÓGICA DE ARQUIVOS LOCAIS (Universal: PC e Android) --- */
folderInput.addEventListener('change', (e) => {
  const files = Array.from(e.target.files).filter(f => 
    f.type.includes('audio') || f.name.match(/\.(mp3|aac|m4a|wav)$/i)
  );
  if(files.length > 0) {
    isLocalMode = true;
    
    btnLocal.classList.add('active');
    btnOnline.classList.remove('active');
    
    localPlaylist = files;
    localIndex = 0;
    
    if(isPlaying) { audio.pause(); stopMetadata(); }
    playLocalTrack();
  } else {
    alert("Nenhum ficheiro de áudio suportado selecionado. Lembre-se: no telemóvel, mantenha pressionado para selecionar vários.");
  }
});

/* --- SETAR ARTE --- */
function setArtworkState(hasCover, artUrl = null) {
  if (hasCover && artUrl) {
    cover.src = artUrl; bgImg.src = artUrl;
    artWrap.classList.add('has-cover');
  } else {
    cover.src = ""; bgImg.src = DEFAULT_BG;
    artWrap.classList.remove('has-cover');
  }
}

/* --- TELA CHEIA E VOLUME --- */
function isFullScreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function toggleFullScreen() {
  if(isFullScreen()) {
    if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  } else {
    if (appContainer.requestFullscreen) appContainer.requestFullscreen().catch(()=>{});
    else if (appContainer.webkitRequestFullscreen) appContainer.webkitRequestFullscreen();
  }
}
fsBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFullScreen(); });

const savedVol = localStorage.getItem('jazz24_vol');
if(savedVol) vol.value = savedVol;
audio.volume = parseFloat(vol.value);
vol.addEventListener('input', () => {
  audio.volume = parseFloat(vol.value);
  localStorage.setItem('jazz24_vol', vol.value);
  if(audio.muted && audio.volume > 0){ audio.muted = false; muteBtn.textContent = '🔊'; }
});
muteBtn.addEventListener('click', () => { audio.muted = !audio.muted; muteBtn.textContent = audio.muted ? '🔇' : '🔊'; });

/* --- ANALISADOR VISUAL (CANVAS) --- */
function setupAnalyser(){
  if(audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 128;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    sourceNode = audioCtx.createMediaElementSource(audio);
    sourceNode.connect(analyser); analyser.connect(audioCtx.destination);
  } catch(e) {}
}

function draw(){
  requestAnimationFrame(draw);
  if (!canvas.offsetWidth) return;
  const w = canvas.width = canvas.offsetWidth * 2, h = canvas.height = canvas.offsetHeight * 2;
  ctx.clearRect(0,0,w,h);
  if(!analyser || !dataArray) return;
  analyser.getByteFrequencyData(dataArray);
  
  const barW = w / dataArray.length * 1.9; let x = 0;
  const r = isLightMode ? 0 : 255, g = isLightMode ? 0 : 255, b = isLightMode ? 0 : 255;

  for(let i=0;i<dataArray.length;i++){
    const v = dataArray[i]/255; const bh = v * h * 0.92;
    ctx.fillStyle = `rgba(${r},${g},${b},${0.18 + v*0.82})`;
    ctx.fillRect(x, h - bh, barW*0.78, bh); x += barW;
  }
}
draw();

/* --- FUNÇÕES DE REPRODUÇÃO LOCAL --- */
function playLocalTrack() {
  const file = localPlaylist[localIndex];
  
  if (currentLocalUrl) URL.revokeObjectURL(currentLocalUrl);
  currentLocalUrl = URL.createObjectURL(file);
  audio.src = currentLocalUrl;
  
  tTitle.textContent = file.name.replace(/\.[^/.]+$/, ""); 
  tArtist.textContent = "A ler metadados...";
  stationDesc.textContent = `Faixa Local: ${localIndex + 1} de ${localPlaylist.length}`;
  formatBadge.textContent = "LEITURA DE DISCO";
  artBadge.textContent = "A ler ID3...";
  statusEl.textContent = "";
  setArtworkState(false);
  
  setupAnalyser();
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  audio.play().then(() => {
    isPlaying = true;
    artWrap.classList.add('playing');
    playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
    playBtn.classList.remove('is-paused');
  }).catch(e => console.error("Erro ao reproduzir ficheiro local:", e));

  if(window.jsmediatags) {
    window.jsmediatags.read(file, {
      onSuccess: function(tag) {
        if(tag.tags.title) tTitle.textContent = tag.tags.title;
        if(tag.tags.artist) tArtist.textContent = tag.tags.artist;
        if(tag.tags.album) stationDesc.textContent = tag.tags.album;
        if(tag.tags.picture) {
          const data = tag.tags.picture.data;
          const format = tag.tags.picture.format;
          let base64String = "";
          for (let i = 0; i < data.length; i++) { base64String += String.fromCharCode(data[i]); }
          const imgUrl = `data:${format};base64,${window.btoa(base64String)}`;
          setArtworkState(true, imgUrl);
          artBadge.textContent = "Capa: Metadados ID3";
        } else {
          artBadge.textContent = "Sem Capa Interna";
        }
      },
      onError: function(error) { 
        console.warn("Erro ao ler ID3:", error); 
        artBadge.textContent = "Sem Metadados";
        tArtist.textContent = "Artista Desconhecido";
      }
    });
  }
}

audio.addEventListener('ended', () => { if (isLocalMode) changeStation(1); });

/* --- FUNÇÕES DA WEB RÁDIO --- */
function fetchArtwork(artist, title){
  return new Promise((resolve) => {
    const q = `${artist} ${title}`.trim();
    if(!q || q === lastQuery){ resolve(null); return; }
    lastQuery = q; artBadge.textContent = `Buscando arte...`;
    const cb = 'itunesCb_' + Date.now();
    const timeout = setTimeout(() => { try{delete window[cb];}catch(e){} resolve(null); }, 8000);

    window[cb] = (data) => {
      let art = null;
      if(data && data.results && data.results[0]){
        art = data.results[0].artworkUrl100.replace('100x100bb','600x600bb');
        setArtworkState(true, art);
        artBadge.textContent = `Arte: ${data.results[0].artistName}`;
      } else {
        setArtworkState(false); artBadge.textContent = 'Arte: fallback';
      }
      clearTimeout(timeout); try{delete window[cb];}catch(e){}
      resolve(art);
    };
    const script = document.createElement('script');
    script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&limit=1&callback=${cb}`;
    document.body.appendChild(script);
  });
}

function parseStreamTitle(s){
  if(!s) return {artist: currentStation.artist, title: currentStation.name};
  const parts = s.split(' - ');
  return parts.length>=2 ? {artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim()} : {artist: currentStation.artist, title:s.trim()};
}

async function startMetadata(){
  if (metaInterval || isLocalMode) return; 
  let failedAttempts = 0; 
  const readIcy = async () => {
    if (metaAbort) metaAbort.abort();
    metaAbort = new AbortController();
    try {
      const res = await fetch(currentStation.url, { headers: { 'Icy-MetaData': '1' }, signal: metaAbort.signal });
      const metaint = parseInt(res.headers.get('icy-metaint') || '0', 10);
      if (!res.body || !metaint) return;
      const reader = res.body.getReader();
      let buffer = new Uint8Array(0);
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        const merged = new Uint8Array(buffer.length + value.length);
        merged.set(buffer); merged.set(value, buffer.length);
        buffer = merged;
        while (buffer.length >= metaint + 1) {
          buffer = buffer.slice(metaint);
          const metaLen = buffer[0] * 16;
          if (buffer.length < 1 + metaLen) break;
          const metaBytes = buffer.slice(1, 1 + metaLen);
          buffer = buffer.slice(1 + metaLen);
          const raw = new TextDecoder('utf-8').decode(metaBytes).replace(/\0+$/,'');
          const m = raw.match(/StreamTitle='(.*?)';/);
          if (m && m[1] && m[1] !== lastStreamTitle) {
            lastStreamTitle = m[1];
            const { artist, title } = parseStreamTitle(m[1]);
            tTitle.textContent = title; tArtist.textContent = artist;
            await fetchArtwork(artist, title);
          }
        }
      }
    } catch (e) {
      if (e.name === 'AbortError') return; 
      console.warn(`Leitura de metadados bloqueada (CORS) para: ${currentStation.name}.`);
      failedAttempts++;
      if (failedAttempts >= 1) {
        stopMetadata(); 
        artBadge.textContent = "Sem Metadados (CORS)"; 
      }
    }
  };
  readIcy(); metaInterval = setInterval(readIcy, 20000);
}

function stopMetadata(){
  if (metaInterval) { clearInterval(metaInterval); metaInterval = null; }
  if (metaAbort) { metaAbort.abort(); metaAbort = null; }
}

function updateUIForWebStation() {
  tTitle.textContent = currentStation.name;
  tArtist.textContent = currentStation.artist;
  stationDesc.textContent = currentStation.desc;
  formatBadge.textContent = "HTTPS • STREAM";
  setArtworkState(false);
  lastStreamTitle = ""; lastQuery = "";
  artBadge.textContent = 'Arte: iTunes Search';
}

/* --- PLAY / PAUSE E NAVEGAÇÃO GERAL --- */
async function togglePlay(){
  if(!isPlaying){
    try{
      setupAnalyser();
      if(audioCtx && audioCtx.state==='suspended') await audioCtx.resume();
      if (!isLocalMode && !audio.src.includes('blob:')) {
         audio.src = currentStation.url;
      }
      await audio.play();
      isPlaying = true;
      artWrap.classList.add('playing');
      playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
      playBtn.classList.remove('is-paused');
      if(!isLocalMode) startMetadata();
    }catch(err){ console.error(err); }
  }else{
    audio.pause(); if(!isLocalMode) stopMetadata();
    isPlaying = false;
    artWrap.classList.remove('playing');
    playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v14l11-7-11-7z"/></svg>';
    playBtn.classList.add('is-paused');
  }
}

function changeStation(direction) {
  const wasPlaying = isPlaying;
  
  if (wasPlaying) {
    audio.pause(); stopMetadata(); isPlaying = false;
    artWrap.classList.remove('playing');
  }

  if (isLocalMode) {
    localIndex = (localIndex + direction + localPlaylist.length) % localPlaylist.length;
    playLocalTrack();
  } else {
    currentStationIndex = (currentStationIndex + direction + STATIONS.length) % STATIONS.length;
    currentStation = STATIONS[currentStationIndex];
    audio.src = ''; 
    updateUIForWebStation();
    if (wasPlaying) togglePlay();
  }
}

playBtn.addEventListener('click', togglePlay);
prevBtn.addEventListener('click', () => changeStation(-1));
nextBtn.addEventListener('click', () => changeStation(1));

// Inicia a aplicação na interface da rádio Web
updateUIForWebStation();
</script>
